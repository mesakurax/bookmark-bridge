name: test-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Chinese help smoke test
        shell: pwsh
        run: |
          $help = & .\bookmark-bridge.cmd -h
          if (($help -join "`n") -notlike '*三个单项命令*' -and ($help -join "`n") -notlike '*收藏夹、密码和浏览记录*') {
            throw 'Help smoke test failed.'
          }
      - name: Installer smoke test
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'bookmark-bridge-app'
          $bin = Join-Path $env:RUNNER_TEMP 'bookmark-bridge-bin'
          & .\install.ps1 -InstallDir $app -BinDir $bin -SkipPathUpdate -SkipBrowserRegistration
          $version = & (Join-Path $bin 'bookmark-bridge.cmd') --version
          $expected = (Get-Content -LiteralPath .\package.json -Raw | ConvertFrom-Json).version
          if (($version -join "`n") -notlike "*$expected*") {
            throw 'Installer smoke test failed.'
          }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build Windows ZIP
        shell: pwsh
        run: |
          $name = "bookmark-bridge-$env:GITHUB_REF_NAME-windows"
          $stage = Join-Path $PWD "dist\$name"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $files = @(
            'bookmark-bridge.js', 'bookmark-api-sync.js', 'ui-job.js', 'history-sync.js', 'password-migrate.js',
            'bookmark-bridge.cmd',
            'native-host.cs', 'install.ps1', 'uninstall.ps1', 'README.md', 'LICENSE'
          )
          Copy-Item -LiteralPath $files -Destination $stage
          Copy-Item -LiteralPath 'extension' -Destination $stage -Recurse
          $framework = if ([Environment]::Is64BitOperatingSystem) {
            'C:\Windows\Microsoft.NET\Framework64\v4.0.30319'
          } else {
            'C:\Windows\Microsoft.NET\Framework\v4.0.30319'
          }
          $compiler = Join-Path $framework 'csc.exe'
          $webExtensions = Join-Path $framework 'System.Web.Extensions.dll'
          & $compiler /nologo /target:exe "/out:$stage\bookmark-bridge-host.exe" "/reference:$webExtensions" .\native-host.cs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath "$stage\bookmark-bridge-host.exe")) {
            throw 'Native Host compilation failed.'
          }
          $versionedZip = "dist\$name.zip"
          $stableZip = 'dist\bookmark-bridge-windows.zip'
          Compress-Archive -Path "$stage\*" -DestinationPath $versionedZip -CompressionLevel Optimal
          Copy-Item -LiteralPath $versionedZip -Destination $stableZip
      - name: Packaged installer smoke test
        shell: pwsh
        run: |
          $stage = Get-ChildItem -LiteralPath dist -Directory -Filter 'bookmark-bridge-*-windows' | Select-Object -First 1
          $app = Join-Path $env:RUNNER_TEMP 'bookmark-bridge-release-app'
          $bin = Join-Path $env:RUNNER_TEMP 'bookmark-bridge-release-bin'
          & (Join-Path $stage.FullName 'install.ps1') -InstallDir $app -BinDir $bin -SkipPathUpdate -SkipBrowserRegistration
          $sourceHash = (Get-FileHash -LiteralPath (Join-Path $stage.FullName 'bookmark-bridge-host.exe')).Hash
          $installedHash = (Get-FileHash -LiteralPath (Join-Path $app 'bookmark-bridge-host.exe')).Hash
          if ($sourceHash -ne $installedHash) {
            throw 'Packaged installer did not use the precompiled Native Host.'
          }
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $versionedZip = Get-ChildItem -LiteralPath dist -Filter 'bookmark-bridge-*-windows.zip' | Select-Object -First 1
          $stableZip = Join-Path $PWD 'dist\bookmark-bridge-windows.zip'
          gh release create $env:GITHUB_REF_NAME $versionedZip.FullName $stableZip --generate-notes --title "Bookmark Bridge $env:GITHUB_REF_NAME"
